<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prueba de Dispositivos de Entrada</title>
</head>
<body>

  <div id="contenedor-mando">
    <h2>Mando (Gamepad)</h2>
    <p id="estado">Estado: Desconectado (presiona un botón)</p>
    <p id="mando-nombre">Mando: Ninguno</p>
    <p id="gatillos">Gatillos T2: L2/T2: 0.00 | R2/T2: 0.00</p>
    <p id="stick-izq">Stick Izquierdo: X: 0.00, Y: 0.00</p>
    <p id="stick-der">Stick Derecho: X: 0.00, Y: 0.00</p>
  </div>

  <script>
    function updateGamepadLoop() {
      const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
      
      let gp = null;
      for (let i = 0; i < gamepads.length; i++) {
        if (gamepads[i]) {
          gp = gamepads[i];
          break;
        }
      }

      if (gp) {
        document.getElementById('estado').textContent = 'Estado: Conectado';
        document.getElementById('mando-nombre').textContent = `Mando: ${gp.id}`;

        const l2Val = gp.buttons[6] ? gp.buttons[6].value : (gp.axes[2] || 0);
        const r2Val = gp.buttons[7] ? gp.buttons[7].value : (gp.axes[5] || 0);

        document.getElementById('gatillos').textContent = 
          `Gatillos T2: L2/T2: ${Number(l2Val).toFixed(2)} | R2/T2: ${Number(r2Val).toFixed(2)}`;

        const axisLX = gp.axes[0] ? Number(gp.axes[0]).toFixed(2) : '0.00';
        const axisLY = gp.axes[1] ? Number(gp.axes[1]).toFixed(2) : '0.00';
        const axisRX = gp.axes[2] ? Number(gp.axes[2]).toFixed(2) : '0.00';
        const axisRY = gp.axes[3] ? Number(gp.axes[3]).toFixed(2) : '0.00';

        document.getElementById('stick-izq').textContent = `Stick Izquierdo: X: ${axisLX}, Y: ${axisLY}`;
        document.getElementById('stick-der').textContent = `Stick Derecho: X: ${axisRX}, Y: ${axisRY}`;
      } else {
        document.getElementById('estado').textContent = 'Estado: Desconectado (presiona un botón)';
        document.getElementById('mando-nombre').textContent = 'Mando: Ninguno';
      }

      requestAnimationFrame(updateGamepadLoop);
    }

    window.addEventListener('keydown', () => {});
    window.addEventListener('touchstart', () => {});
    window.addEventListener('click', () => {});

    requestAnimationFrame(updateGamepadLoop);
  </script>
</body>
</html>
